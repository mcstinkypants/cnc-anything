[package]
name = "cnc-anything"
version = "0.1.3"
edition = "2021"
description = "CNC Anything: design jobs and send them to GRBL laser cutters and CNC routers"

[[bin]]
name = "cnc-anything"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "=0.29.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ttf-parser = "0.25"
roxmltree = "0.20"
cavalier_contours = "0.9"
serialport = { version = "4", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
